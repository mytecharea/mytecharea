<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .logo-bg { fill: #1d4ed8; }
      .logo-accent { fill: #60a5fa; }
      .logo-highlight { fill: #93c5fd; }
    </style>
  </defs>

  <!-- Main geometric shape -->
  <g transform="translate(100,100)">
    <!-- Hexagon base -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" class="logo-bg" opacity="0.9"/>

    <!-- Inner hexagon -->
    <polygon points="0,-35 30,-17.5 30,17.5 0,35 -30,17.5 -30,-17.5" class="logo-accent" opacity="0.8"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="8" class="logo-highlight"/>

    <!-- Connecting lines -->
    <line x1="-30" y1="-17.5" x2="30" y2="17.5" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
    <line x1="30" y1="-17.5" x2="-30" y2="17.5" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
