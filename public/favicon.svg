<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .favicon-bg { fill: #1d4ed8; }
      .favicon-accent { fill: #60a5fa; }
      .favicon-highlight { fill: #93c5fd; }
    </style>
  </defs>

  <!-- Main geometric shape -->
  <g transform="translate(32,32)">
    <!-- Hexagon base -->
    <polygon points="0,-19 16,-9.5 16,9.5 0,19 -16,9.5 -16,-9.5" class="favicon-bg" opacity="0.9"/>

    <!-- Inner hexagon -->
    <polygon points="0,-11 9.5,-5.5 9.5,5.5 0,11 -9.5,5.5 -9.5,-5.5" class="favicon-accent" opacity="0.8"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="2.5" class="favicon-highlight"/>

    <!-- Connecting lines -->
    <line x1="-9.5" y1="-5.5" x2="9.5" y2="5.5" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
    <line x1="9.5" y1="-5.5" x2="-9.5" y2="5.5" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#93c5fd" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>
