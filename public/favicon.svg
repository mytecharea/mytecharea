<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .favicon-bg { fill: #1d4ed8; }
      .favicon-accent { fill: #60a5fa; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" class="favicon-bg"/>
  
  <!-- Simplified tech arrow -->
  <g class="favicon-accent">
    <line x1="16" y1="24" x2="16" y2="40" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="20" x2="32" y2="44" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="26" x2="48" y2="38" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="32" x2="32" y2="32" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="28" x2="48" y2="28" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="48,28 56,32 48,36" class="favicon-accent"/>
  </g>
</svg>
