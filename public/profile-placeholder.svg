<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .profile-bg { fill: #e2e8f0; }
      .profile-icon { fill: #64748b; }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" class="profile-bg"/>

  <!-- User icon -->
  <g transform="translate(100,100)">
    <!-- Head -->
    <circle cx="0" cy="-15" r="25" class="profile-icon"/>

    <!-- Body -->
    <path d="M-20,10 Q-20,25 0,25 Q20,25 20,10 L20,35 Q20,45 10,45 L-10,45 Q-20,45 -20,35 Z" class="profile-icon"/>
  </g>

  <!-- Placeholder text -->
  <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Your Photo Here</text>
</svg>