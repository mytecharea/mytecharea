<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="500" height="100">
  <defs>
    <style>
      .logo-shape { fill: #1d4ed8; }
      .logo-accent { fill: #60a5fa; }
      .logo-highlight { fill: #93c5fd; }
      .logo-text-dark { fill: #1d4ed8; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 48px; font-weight: 700; letter-spacing: -1px; }
    </style>
  </defs>

  <!-- Logo icon -->
  <g transform="translate(50,50)">
    <!-- Hexagon base -->
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" class="logo-shape" opacity="0.9"/>

    <!-- Inner hexagon -->
    <polygon points="0,-17.5 15,-8.75 15,8.75 0,17.5 -15,8.75 -15,-8.75" class="logo-accent" opacity="0.8"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" class="logo-highlight"/>

    <!-- Connecting lines -->
    <line x1="-15" y1="-8.75" x2="15" y2="8.75" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
    <line x1="15" y1="-8.75" x2="-15" y2="8.75" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-17.5" x2="0" y2="17.5" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Text -->
  <text x="120" y="65" class="logo-text-dark">MyTechArea</text>
</svg>
