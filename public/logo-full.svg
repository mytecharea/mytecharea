<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="500" height="100">
  <defs>
    <style>
      .logo-shape { fill: #1d4ed8; }
      .logo-lines { stroke: #60a5fa; fill: none; }
      .logo-text-dark { fill: #1d4ed8; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 48px; font-weight: 700; letter-spacing: -1px; }
    </style>
  </defs>
  
  <!-- Logo icon -->
  <g>
    <!-- Background circle -->
    <circle cx="50" cy="50" r="45" class="logo-shape"/>
    
    <!-- Tech arrow -->
    <g class="logo-lines" stroke-width="3" stroke-linecap="round">
      <line x1="32" y1="30" x2="32" y2="70"/>
      <line x1="50" y1="22" x2="50" y2="78"/>
      <line x1="68" y1="35" x2="68" y2="65"/>
      <line x1="32" y1="50" x2="50" y2="50"/>
      <line x1="50" y1="42" x2="68" y2="42"/>
    </g>
    
    <!-- Arrow head -->
    <polygon points="68,42 80,50 68,58" class="logo-lines" stroke="none" fill="#60a5fa"/>
    
    <!-- Connection dots -->
    <circle cx="32" cy="50" r="3" fill="#60a5fa"/>
    <circle cx="50" cy="50" r="3" fill="#60a5fa"/>
  </g>
  
  <!-- Text -->
  <text x="120" y="65" class="logo-text-dark">MyTechArea</text>
</svg>
