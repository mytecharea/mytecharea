<section
  class="bg-slate-950 text-white min-h-screen py-24 px-6"
>

  <div class="max-w-5xl mx-auto">

    <img
      [src]="blog.image"
      [alt]="blog.title"
      class="w-full rounded-[30px] mb-10"
    />

    <span
      class="bg-cyan-500/10 text-cyan-400 px-4 py-2 rounded-full"
    >
      {{ blog.category }}
    </span>

    <h1
      class="text-4xl md:text-5xl font-bold mt-6 mb-6"
    >
      {{ blog.title }}
    </h1>

    <p
      class="text-slate-400 text-lg leading-8 mb-10"
    >
      {{ blog.description }}
    </p>

    <div
      class="prose prose-invert max-w-none"
      [innerHTML]="blog.content"
    ></div>

  </div>

</section>
